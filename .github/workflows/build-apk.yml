# Builds 5PLUS on GitHub's computers every time you upload changes (or when you press "Run workflow"):
# - 5PLUS.apk: install it straight on a phone (permanent link below).
# - 5PLUS.aab: the Google Play format (built when the repository is set up for it).
name: Build APK
on:
  push:
  workflow_dispatch:
# Needed to put the files on the public download page (Releases).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: |
          FOUND=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::The app files are missing. Upload everything inside the android folder (app, gradle, settings.gradle.kts, build.gradle.kts, gradle.properties)."
            exit 1
          fi
          cd "$(dirname "$FOUND")"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug
      - name: Build Google Play bundle (AAB)
        if: env.PLAY_KEY_PASSWORD != ''
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:PLAY_KEY_PASSWORD
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" UPLOAD_KEYSTORE_PASSWORD="$PLAY_KEY_PASSWORD" UPLOAD_KEY_ALIAS=upload UPLOAD_KEY_PASSWORD="$PLAY_KEY_PASSWORD"
          gradle --no-daemon --stacktrace bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: 5PLUS-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PLAY_KEY_PASSWORD != ''
        with:
          name: 5PLUS-aab
          path: "**/app/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
      # Permanent public download links (no GitHub account needed), replaced by every new build of main:
      # https://github.com/<owner>/<repo>/releases/download/app/5PLUS.apk  (and 5PLUS.aab for Google Play)
      - name: Publish the download links
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -1)
          cp "$APK" 5PLUS.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "5PLUS app" --notes "5PLUS app" --latest
          gh release upload app 5PLUS.apk --clobber
          AAB=$(find . -path "*/app/build/outputs/bundle/release/*.aab" | head -1)
          if [ -n "$AAB" ]; then cp "$AAB" 5PLUS.aab; gh release upload app 5PLUS.aab --clobber; fi
          R="https://github.com/${{ github.repository }}/releases/download/app"
          {
            echo "Download **5PLUS.apk** below on your Android phone and open it to install. If asked, allow installing from this source."
            echo
            echo "- Phone install (APK, always the newest): $R/5PLUS.apk"
            if [ -n "$AAB" ]; then echo "- Google Play upload (AAB): $R/5PLUS.aab"; fi
            echo "- Website: https://fiveplus.onrender.com"
            echo
            echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          } > notes.md
          gh release edit app --notes-file notes.md
