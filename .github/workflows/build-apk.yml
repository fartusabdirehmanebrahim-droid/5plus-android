# Builds the 5PLUS APK on GitHub's computers every time you upload changes (or when you press "Run workflow").
# Download it from the Actions tab → the latest run → Artifacts → 5PLUS-apk.
# It finds the app folder by itself, so it works whether the files are at the top of the repository or inside a folder.
name: Build APK
on:
  push:
  workflow_dispatch:
# Needed to put the APK on the public download page (Releases).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          FOUND=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::The app files are missing. Upload everything inside the android folder (app, gradle, settings.gradle.kts, build.gradle.kts, gradle.properties)."
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          cd "$(dirname "$FOUND")"
          echo "Building in $(pwd)"
          ls -la
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 5PLUS-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
      # A permanent public download link (no GitHub account needed), replaced by every new build of main:
      # https://github.com/<owner>/<repo>/releases/download/app/5PLUS.apk
      - name: Publish the download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -1)
          cp "$APK" 5PLUS.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "5PLUS app" --notes "Download 5PLUS.apk on your Android phone and open it to install. If asked, allow installing from this source." --latest
          gh release upload app 5PLUS.apk --clobber
          printf '%s\n\n%s\n%s\n%s\n' "Download **5PLUS.apk** below on your Android phone and open it to install. If asked, allow installing from this source." \
            "Direct link (always the newest): https://github.com/${{ github.repository }}/releases/download/app/5PLUS.apk" \
            "Website: https://fiveplus.onrender.com" "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)." > notes.md
          gh release edit app --notes-file notes.md
